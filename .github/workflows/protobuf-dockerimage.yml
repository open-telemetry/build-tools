name: Protobuf Docker Image
on:
  push:
    tags: [ '**' ]
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/protobuf-dockerimage.yml
      - protobuf/Dockerfile
      - protobuf/protoc-wrapper

permissions:
  contents: read
  id-token: write # Required for SLSA build attestations
  attestations: write # Required for generating build provenance

jobs:
  build:
    strategy:
      matrix:
        TARGETARCH: [amd64]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Determine tags
      id: meta
      run: |
        TAGS="otel/build-protobuf:test"
        if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
          TAGS="otel/build-protobuf:latest"
        elif [[ "${GITHUB_REF}" =~ refs/tags/v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          TAG="${GITHUB_REF#"refs/tags/v"}"
          TAGS="otel/build-protobuf:${TAG},otel/build-protobuf:latest"
        elif [[ "${GITHUB_REF}" =~ refs/tags/.* ]]; then
          TAG="${GITHUB_REF#"refs/tags/"}"
          TAGS="otel/build-protobuf:${TAG}"
        fi
        echo "tags=${TAGS}" >> $GITHUB_OUTPUT

    - name: Build and Push Docker image with Attestations
      id: push
      uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
      with:
        context: ./protobuf
        platforms: linux/${{ matrix.TARGETARCH }}
        push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        load: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        tags: ${{ steps.meta.outputs.tags }}
        provenance: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        sbom: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

    - name: Attest Build Provenance to GitHub
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-name: index.docker.io/otel/build-protobuf
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
