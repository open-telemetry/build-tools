name: Protobuf Docker Image
on:
  push:
    tags: [ '**' ]
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/protobuf-dockerimage.yml
      - protobuf/Dockerfile
      - protobuf/protoc-wrapper

permissions:
  contents: read
  id-token: write # Required for SLSA build attestations
  attestations: write # Required for generating build provenance

jobs:
  build:
    strategy:
      matrix:
        TARGETARCH: [amd64]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Determine tags
      id: meta
      run: |
        TAGS="otel/build-protobuf:test"
        if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
          TAGS="otel/build-protobuf:latest"
        elif [[ "${GITHUB_REF}" =~ refs/tags/v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          TAG="${GITHUB_REF#"refs/tags/v"}"
          TAGS="otel/build-protobuf:${TAG},otel/build-protobuf:latest"
        elif [[ "${GITHUB_REF}" =~ refs/tags/.* ]]; then
          TAG="${GITHUB_REF#"refs/tags/"}"
          TAGS="otel/build-protobuf:${TAG}"
        fi
        echo "tags=${TAGS}" >> $GITHUB_OUTPUT

    - name: Build and Push Docker image with Attestations
      id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./protobuf
        platforms: linux/${{ matrix.TARGETARCH }}
        push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        load: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        tags: ${{ steps.meta.outputs.tags }}
        provenance: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        sbom: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

    - name: Attest Build Provenance to GitHub
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: index.docker.io/otel/build-protobuf
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
