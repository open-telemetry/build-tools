name: Protobuf Docker Image
on:
  push:
    tags: [ '**' ]
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/protobuf-dockerimage.yml
      - protobuf/Dockerfile
      - protobuf/protoc-wrapper

permissions:
  contents: read
  id-token: write # Required for SLSA build attestations
  attestations: write # Required for generating build provenance

jobs:
  build:
    strategy:
      matrix:
        TARGETARCH: [amd64]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Determine tags
      id: meta
      run: |
        TAGS="otel/build-protobuf:test"
        if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
          TAGS="otel/build-protobuf:latest"
        elif [[ "${GITHUB_REF}" =~ refs/tags/v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          TAG="${GITHUB_REF#"refs/tags/v"}"
          TAGS="otel/build-protobuf:${TAG},otel/build-protobuf:latest"
        elif [[ "${GITHUB_REF}" =~ refs/tags/.* ]]; then
          TAG="${GITHUB_REF#"refs/tags/"}"
          TAGS="otel/build-protobuf:${TAG}"
        fi
        echo "tags=${TAGS}" >> $GITHUB_OUTPUT

    - name: Build and Push Docker image with Attestations
      id: push
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: ./protobuf
        platforms: linux/${{ matrix.TARGETARCH }}
        push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        load: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        tags: ${{ steps.meta.outputs.tags }}
        provenance: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        sbom: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

    - name: Attest Build Provenance to GitHub
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-name: index.docker.io/otel/build-protobuf
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
